name: Feature request
description: Propose a bounded component, docs, or package improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What problem does this solve for Bootstrap-native, server-rendered UI?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Documentation
        - Component example
        - Package CSS
        - Optional ESM
        - Certification evidence
        - Other
    validations:
      required: true
  - type: textarea
    id: bootstrap
    attributes:
      label: Bootstrap relationship
      description: Does Bootstrap already provide this markup or behavior?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance notes
      description: What should be true when the request is done?
