name: Secret scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed changes with Gitleaks
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SCAN_EVENT_NAME: ${{ github.event_name }}
          SCAN_REF_TYPE: ${{ github.ref_type }}
          SCAN_REF_NAME: ${{ github.ref_name }}
          SCAN_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          scan_range="$SCAN_HEAD"
          if [[ -n "$SCAN_BASE" && ! "$SCAN_BASE" =~ ^0+$ ]] && \
            git cat-file -e "${SCAN_BASE}^{commit}" 2>/dev/null; then
            scan_range="$SCAN_BASE..$SCAN_HEAD"
          elif [[ "$SCAN_BASE" =~ ^0+$ &&
            "${SCAN_EVENT_NAME:-}" == "push" &&
            "${SCAN_REF_TYPE:-}" == "branch" &&
            -n "${SCAN_DEFAULT_BRANCH:-}" &&
            "${SCAN_REF_NAME:-}" != "$SCAN_DEFAULT_BRANCH" ]] && \
            default_base="$(git merge-base "$SCAN_HEAD" "refs/remotes/origin/$SCAN_DEFAULT_BRANCH" 2>/dev/null)"; then
            # A new branch has no previous tip. Scan its own commits from
            # the default branch's common ancestor, as the PR scan does.
            scan_range="$default_base..$SCAN_HEAD"
          fi
          printf 'Scanning commit range: %s\n' "$scan_range" >&2
          /tmp/gitleaks git . --redact --no-banner --log-opts="$scan_range"
