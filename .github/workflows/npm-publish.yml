name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing v* tag/version guard to publish while running the workflow definition and package source from the selected branch
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.release_ref || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # Same release-tier runner as ui-ci.yml: setup, browser install, full
    # discovery, package verification, and rehearsal can exceed the old
    # 25-minute budget on a cold hosted runner, so publish must wait for a real
    # pass/fail gate instead of a timeout.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.5"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install npm development dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run release test gate
        run: python scripts/run-test-tier.py run release

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Configure npm registry
        run: echo "registry=https://registry.npmjs.org/" >> .npmrc

      - name: Check package version
        id: package
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="${RELEASE_REF:-${GITHUB_REF_NAME}}"
          source_commit="$(git rev-parse HEAD)"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # A prerelease identifier (e.g. "1.0.0-rc.1") must never publish
          # under npm's default "latest" dist-tag, or every plain
          # `npm install @wpmoo/ui` would suddenly resolve to a
          # release candidate instead of the last stable version.
          if [[ "${version}" == *-* ]]; then
            echo "npm_tag=rc" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${RELEASE_REF}" ]; then
            if ! git show-ref --verify --quiet "refs/tags/${tag}"; then
              echo "Release ref ${tag} must be an existing tag."
              exit 1
            fi
          elif [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Publish must run from a version tag, not ${GITHUB_REF_TYPE} ${tag}."
            exit 1
          fi
          if [ "${tag}" != "v${version}" ]; then
            echo "Tag ${tag} does not match package version v${version}."
            exit 1
          fi
          if [ -n "${RELEASE_REF}" ]; then
            release_commit="$(git rev-list -n 1 "${tag}")"
            if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
              echo "Release tag ${tag} does not point to a commit in origin/main history."
              exit 1
            fi
          fi
          if ! git merge-base --is-ancestor "${source_commit}" origin/main; then
            echo "Workflow source commit ${source_commit} is not in origin/main history."
            exit 1
          fi
          if npm view "${name}@${version}" version --silent >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package contents
        if: steps.package.outputs.published == 'false'
        run: npm pack --dry-run

      - name: Publish to npm
        if: steps.package.outputs.published == 'false'
        run: npm publish --access public --provenance --tag "${{ steps.package.outputs.npm_tag }}"

      - name: Create GitHub release notes
        if: startsWith(steps.package.outputs.tag, 'v')
        run: |
          tag="${{ steps.package.outputs.tag }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; skipping."
          else
            release_args=("${tag}" --title "${tag}" --generate-notes)
            if [ "${{ steps.package.outputs.prerelease }}" = "true" ]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attach conformance kit artifact
        if: startsWith(steps.package.outputs.tag, 'v')
        run: |
          tag="${{ steps.package.outputs.tag }}"
          # Build the kit from the tagged commit, not the workflow ref:
          # with inputs.release_ref the checkout may be a later commit
          # carrying the same package version, and the release asset
          # must match the commit the release tag points to.
          git checkout --detach "${tag}"
          kit_version="$(python -c "import json; print(json.load(open('conformance/contract/conformance-contract.json'))['schemaVersion'])")"
          python scripts/package-conformance-kit.py --version "${kit_version}"
          gh release upload "${tag}" \
            "dist/conformance-kit/moo-ui-conformance-kit-${kit_version}.tar.gz" \
            "dist/conformance-kit/moo-ui-conformance-kit-${kit_version}.tar.gz.sha256" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
