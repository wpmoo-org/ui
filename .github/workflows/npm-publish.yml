name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing v* tag to publish while running the workflow definition from the selected branch
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.release_ref || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Install npm development dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Run contract tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Build package and site outputs
        run: .venv/bin/python build.py

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Configure npm registry
        run: echo "registry=https://registry.npmjs.org/" >> .npmrc

      - name: Check package version
        id: package
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="${RELEASE_REF:-${GITHUB_REF_NAME}}"
          source_commit="$(git rev-parse HEAD)"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -n "${RELEASE_REF}" ]; then
            if ! git show-ref --verify --quiet "refs/tags/${tag}"; then
              echo "Release ref ${tag} must be an existing tag."
              exit 1
            fi
          elif [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Publish must run from a version tag, not ${GITHUB_REF_TYPE} ${tag}."
            exit 1
          fi
          if [ "${tag}" != "v${version}" ]; then
            echo "Tag ${tag} does not match package version v${version}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${source_commit}" origin/main; then
            echo "Tag ${tag} does not point to a commit in origin/main history."
            exit 1
          fi
          if npm view "${name}@${version}" version --silent >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package contents
        run: npm pack --dry-run --json | .venv/bin/python scripts/verify_package_contents.py

      - name: Publish to npm
        if: steps.package.outputs.published == 'false'
        run: npm publish --access public --provenance

      - name: Create GitHub release notes
        if: startsWith(steps.package.outputs.tag, 'v')
        run: |
          tag="${{ steps.package.outputs.tag }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; skipping."
          else
            gh release create "${tag}" --title "${tag}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
