name: UI CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: ui-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Install npm development dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Run contract and certification tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Build package and site outputs
        run: .venv/bin/python build.py

      - name: Verify npm package contents
        run: npm pack --dry-run --json | .venv/bin/python scripts/verify_package_contents.py
