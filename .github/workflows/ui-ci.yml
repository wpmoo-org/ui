name: UI CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      tier:
        description: Test tier to run
        required: false
        default: auto
        type: choice
        options:
          - auto
          - quick
          - browser-smoke
          - browser-full
          - release

permissions:
  contents: read

concurrency:
  group: ui-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: ui-tests
    runs-on: ubuntu-latest
    # The full suite alone now runs ~6-9 minutes locally; on a cold ubuntu-latest
    # runner with setup steps included, the old 10-minute budget was getting cut
    # off mid-suite (observed: cancelled at 10:14 elapsed, mid "Run contract and
    # certification tests"), not from a real failure.
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.5"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Install npm development dependencies
        run: npm ci --ignore-scripts

      - name: Select test tier
        id: test-tier
        env:
          REQUESTED_TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'auto' }}
          DIFF_BASE: ${{ github.event.before || '' }}
        run: >
          .venv/bin/python scripts/run-test-tier.py resolve
          "${REQUESTED_TIER}"
          --event-name "${GITHUB_EVENT_NAME}"
          --ref-name "${GITHUB_REF_NAME}"
          --base "${DIFF_BASE}"
          --head "${GITHUB_SHA}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Install Playwright Chromium
        if: steps.test-tier.outputs.needs_playwright == 'true'
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Run selected test tier
        env:
          DIFF_BASE: ${{ github.event.before || '' }}
        run: >
          .venv/bin/python scripts/run-test-tier.py run
          "${{ steps.test-tier.outputs.tier }}"
          --base "${DIFF_BASE}"
          --head "${GITHUB_SHA}"
