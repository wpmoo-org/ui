<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sidebar certification fixture</title>
    <link rel="stylesheet" href="/dist/assets/css/moo-ui.css">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
      }

      .sidebar-inset main {
        padding: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div
      class="sidebar-wrapper vh-100 overflow-hidden"
      data-slot="sidebar-wrapper"
      data-sidebar-state="expanded"
      data-sidebar-key="certification-shell"
    >
      <aside
        id="certification-sidebar"
        class="sidebar offcanvas-lg offcanvas-start"
        tabindex="-1"
        data-slot="sidebar"
        aria-label="Certification navigation"
        data-side="left"
        data-variant="sidebar"
        data-collapsible="icon"
      >
        <div class="sidebar-inner" data-slot="sidebar-inner">
          <div class="sidebar-header" data-slot="sidebar-header">
            <ul class="sidebar-menu" data-slot="sidebar-menu">
              <li class="sidebar-menu-item dropend" data-slot="sidebar-menu-item">
                <button
                  class="sidebar-menu-button sidebar-menu-button--lg sidebar-menu-button--workspace"
                  id="certification-sidebar-workspace"
                  type="button"
                  data-slot="sidebar-menu-button"
                  data-bs-toggle="dropdown"
                  data-bs-offset="0,4"
                  data-sidebar-tooltip="Workspace"
                  aria-expanded="false"
                >
                  <span class="sidebar-menu-button__text">
                    <span class="sidebar-menu-button__title">Workspace</span>
                  </span>
                </button>
                <ul class="dropdown-menu" id="certification-sidebar-workspace-menu">
                  <li><h6 class="dropdown-header">Workspaces</h6></li>
                  <li><button class="dropdown-item" type="button">Primary workspace</button></li>
                  <li><button class="dropdown-item" type="button">Review workspace</button></li>
                  <li><button class="dropdown-item" type="button">Add workspace</button></li>
                </ul>
              </li>
            </ul>
          </div>
          <div class="sidebar-content" data-slot="sidebar-content">
            <div class="sidebar-group" data-slot="sidebar-group">
              <div class="sidebar-group-label" data-slot="sidebar-group-label">Workspace</div>
              <div class="sidebar-group-content" data-slot="sidebar-group-content">
                <ul class="sidebar-menu" data-slot="sidebar-menu">
                  <li class="sidebar-menu-item" data-slot="sidebar-menu-item">
                    <a
                      class="sidebar-menu-button active"
                      href="#overview"
                      data-slot="sidebar-menu-button"
                      data-sidebar-tooltip="Overview"
                      aria-current="page"
                    >
                      <span class="sidebar-menu-button__text">
                        <span class="sidebar-menu-button__title">Overview</span>
                      </span>
                    </a>
                  </li>
                  <li class="sidebar-menu-item" data-slot="sidebar-menu-item">
                    <a
                      class="sidebar-menu-button"
                      href="#activity"
                      data-slot="sidebar-menu-button"
                      data-sidebar-tooltip="Activity"
                    >
                      <span class="sidebar-menu-button__text">
                        <span class="sidebar-menu-button__title">Activity</span>
                      </span>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <div class="sidebar-footer" data-slot="sidebar-footer">
            <label class="form-label" for="certification-sidebar-search">Search navigation</label>
            <input
              class="form-control sidebar-input"
              id="certification-sidebar-search"
              type="search"
            >
            <ul class="sidebar-menu" data-slot="sidebar-menu">
              <li
                class="sidebar-menu-item sidebar-menu-item--account dropend"
                data-slot="sidebar-menu-item"
              >
                <button
                  class="sidebar-menu-button sidebar-menu-button--lg sidebar-menu-button--account"
                  id="certification-sidebar-account"
                  type="button"
                  data-slot="sidebar-menu-button"
                  data-bs-toggle="dropdown"
                  data-bs-offset="0,4"
                  data-sidebar-tooltip="Account"
                  aria-expanded="false"
                >
                  <span class="sidebar-menu-button__text">
                    <span class="sidebar-menu-button__title">Account</span>
                  </span>
                </button>
                <ul class="dropdown-menu" id="certification-sidebar-account-menu">
                  <li><button class="dropdown-item" type="button">Profile</button></li>
                  <li><button class="dropdown-item" type="button">Preferences</button></li>
                  <li><button class="dropdown-item" type="button">Sign out</button></li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
        <button
          class="sidebar-rail"
          type="button"
          data-sidebar-rail
          aria-label="Toggle sidebar"
          tabindex="-1"
        ></button>
      </aside>

      <div class="sidebar-inset overflow-hidden" data-slot="sidebar-inset">
        <header class="sidebar-inset__header">
          <button
            class="btn btn-ghost btn-icon-sm sidebar-trigger"
            id="certification-sidebar-trigger"
            type="button"
            data-sidebar-trigger
            data-bs-target="#certification-sidebar"
            aria-label="Toggle sidebar"
            aria-controls="certification-sidebar"
            aria-expanded="true"
          >
            Toggle
          </button>
        </header>
        <main
          class="sidebar-inset__content overflow-auto scroll-fade-y"
          data-slot="sidebar-inset-content"
          id="overview"
          tabindex="-1"
        >
          <h1>Sidebar certification fixture</h1>
          <article class="card min-vh-100 p-4">
            <h2 class="h4">Inset content surface</h2>
            <p id="activity">The main application surface remains independently focusable.</p>
            <p>Later content remains below the sidebar identity menus when they are open.</p>
          </article>
        </main>
      </div>
    </div>

    <script src="/vendor/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
      import Sidebar from "/dist/js/sidebar.js";

      const root = document.querySelector('[data-slot="sidebar-wrapper"]');
      const sidebar = document.querySelector('[data-slot="sidebar"]');
      if (new URLSearchParams(window.location.search).get("side") === "right") {
        sidebar.dataset.side = "right";
      }
      root.addEventListener("change.moo.sidebar", event => {
        document.body.dataset.sidebarState = event.detail.state;
      });
      window.CertificationSidebar = Sidebar;
      window.certificationSidebar = Sidebar.getOrCreateInstance(root);
      document.body.dataset.sidebarReady = "true";
    </script>
  </body>
</html>
