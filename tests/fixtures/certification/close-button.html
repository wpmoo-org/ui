<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Close Button certification fixture</title>
    <link rel="stylesheet" href="/dist/assets/css/moo-ui.css">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
      }

      main {
        display: grid;
        gap: 1.5rem;
        max-width: 32rem;
      }

      [data-certification-surface] {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="fixture-title">
      <h1 id="fixture-title">Close Button certification fixture</h1>

      <section aria-label="Standalone close buttons" data-certification-surface>
        <button type="button" class="btn-close" aria-label="Close" id="certification-close-button-default"></button>
        <button type="button" class="btn-close" aria-label="Dismiss notification" id="certification-close-button-custom-label"></button>
        <button type="button" class="btn-close" aria-label="Close" id="certification-close-button-disabled" disabled></button>
      </section>

      <section aria-label="Dismissible composition" data-certification-surface>
        <div
          class="alert alert-primary alert-dismissible fade show"
          role="alert"
          id="certification-close-button-alert"
        >
          <div class="alert-body" id="certification-close-button-alert-body">
            <div class="alert-heading mb-0">Deployment scheduled for 6:00 PM UTC.</div>
          </div>
          <button
            type="button"
            class="btn-close"
            aria-label="Close"
            data-bs-dismiss="alert"
            id="certification-close-button-dismiss"
          ></button>
        </div>
      </section>
    </main>
    <script src="/vendor/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
