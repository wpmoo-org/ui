<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Typography certification fixture</title>
    <link rel="stylesheet" href="/dist/assets/css/moo-ui.css">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
      }

      main {
        display: grid;
        gap: 1rem;
        max-width: 42rem;
      }

      [data-certification-surface] {
        display: grid;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="fixture-title">
      <h1 id="fixture-title">Typography certification fixture</h1>

      <section aria-label="Typography variants" data-certification-surface>
        <h1 class="fw-semibold" id="certification-typography-page-title">Deployment history</h1>
        <p class="moo-page-description text-body-secondary mb-0" id="certification-typography-page-description">
          Review every release rolled out to the production environment.
        </p>
        <h2 class="h3" id="certification-typography-section-title">Recent releases</h2>
        <h2 class="h4" id="certification-typography-example-title">Rollback window</h2>
        <span class="text-body-secondary" id="certification-typography-muted">Last checked 2 minutes ago</span>
        <span class="small fw-semibold" id="certification-typography-section-label">Environment</span>
        <code id="certification-typography-inline-code">npm run release</code>
      </section>
    </main>
  </body>
</html>
