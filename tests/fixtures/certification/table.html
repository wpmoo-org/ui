<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Table certification fixture</title>
    <link rel="stylesheet" href="/dist/assets/css/moo-ui.css">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
      }

      main {
        display: grid;
        gap: 1.5rem;
        max-width: 42rem;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="fixture-title">
      <h1 id="fixture-title">Table certification fixture</h1>

      <section aria-labelledby="table-basic-title">
        <h2 id="table-basic-title" class="h5">Deployments</h2>
        <div class="table-responsive">
          <table class="table table-striped table-hover" id="certification-table">
            <caption>Recent deployments across environments</caption>
            <thead>
              <tr>
                <th scope="col">Environment</th>
                <th scope="col">Status</th>
                <th scope="col" class="text-end">Duration</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr id="certification-table-row-production">
                <th scope="row">Production</th>
                <td>Success</td>
                <td class="text-end">2m 14s</td>
                <td>
                  <div class="table-row-actions dropdown">
                    <button
                      class="btn btn-ghost btn-icon-sm"
                      type="button"
                      data-bs-toggle="dropdown"
                      aria-expanded="false"
                      aria-label="Open menu"
                      id="certification-table-row-actions-trigger"
                    >
                      <svg data-icon="inline-start" data-lucide="ellipsis" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></g></svg>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                      <li><a class="dropdown-item" href="#view">View details</a></li>
                      <li><button class="dropdown-item" type="button">Retry deployment</button></li>
                    </ul>
                  </div>
                </td>
              </tr>
              <tr id="certification-table-row-staging">
                <th scope="row">Staging</th>
                <td>Failed</td>
                <td class="text-end">45s</td>
                <td></td>
              </tr>
              <tr id="certification-table-row-preview">
                <th scope="row">Preview</th>
                <td>Running</td>
                <td class="text-end">12s</td>
                <td></td>
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <th scope="row">Total</th>
                <td>3 deployments</td>
                <td class="text-end">3m 11s</td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </section>
    </main>
    <script src="/vendor/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
