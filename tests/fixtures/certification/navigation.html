<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Navigation certification fixture</title>
    <link rel="stylesheet" href="/dist/assets/css/moo-ui.css">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
      }

      main {
        display: grid;
        gap: 1.5rem;
        max-width: 24rem;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="fixture-title">
      <h1 id="fixture-title">Navigation certification fixture</h1>

      <section aria-labelledby="navigation-pills-title">
        <h2 id="navigation-pills-title" class="h5">Pills navigation</h2>
        <nav aria-label="Workspace navigation" id="certification-navigation-pills">
          <ul class="nav nav-pills">
            <li class="nav-item">
              <a class="nav-link active" href="#overview" aria-current="page" id="certification-navigation-overview">Overview</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#members" id="certification-navigation-members">Members</a>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true" tabindex="-1" id="certification-navigation-billing">Billing</a>
            </li>
          </ul>
        </nav>
      </section>

      <section aria-labelledby="navigation-underline-title">
        <h2 id="navigation-underline-title" class="h5">Underline navigation</h2>
        <nav aria-label="Settings" id="certification-navigation-underline">
          <ul class="nav nav-underline flex-column gap-1">
            <li class="nav-item">
              <a class="nav-link active" href="#general" aria-current="page">
                <svg data-icon="inline-start" data-lucide="settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0a2.34 2.34 0 0 0 3.319 1.915a2.34 2.34 0 0 1 2.33 4.033a2.34 2.34 0 0 0 0 3.831a2.34 2.34 0 0 1-2.33 4.033a2.34 2.34 0 0 0-3.319 1.915a2.34 2.34 0 0 1-4.659 0a2.34 2.34 0 0 0-3.32-1.915a2.34 2.34 0 0 1-2.33-4.033a2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></g></svg>
                <span>General</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#security">
                <svg data-icon="inline-start" data-lucide="circle-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/></g></svg>
                <span>Security</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#notifications" id="certification-navigation-notifications">
                <svg data-icon="inline-start" data-lucide="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.268 21a2 2 0 0 0 3.464 0m-10.47-5.674A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
                <span>Notifications</span>
                <span class="badge text-bg-secondary rounded-pill ms-auto">3</span>
              </a>
            </li>
          </ul>
        </nav>
      </section>
    </main>
  </body>
</html>
