<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Switch certification fixture</title>
    <link rel="stylesheet" href="/dist/assets/css/moo-ui.css">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
      }

      main {
        display: grid;
        gap: 1.5rem;
        max-width: 42rem;
      }

      [data-certification-surface] {
        display: grid;
        gap: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="fixture-title">
      <h1 id="fixture-title">Switch certification fixture</h1>

      <section aria-labelledby="switch-default-title" data-certification-surface>
        <h2 id="switch-default-title" class="h5">Default</h2>
        <div class="form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            id="certification-switch-default"
          >
          <label class="form-check-label" for="certification-switch-default">
            Enable workflow backup window
          </label>
        </div>
        <div class="form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            id="certification-switch-checked"
            checked
          >
          <label class="form-check-label" for="certification-switch-checked">
            Sync incidents after approval
          </label>
        </div>
      </section>

      <section aria-labelledby="switch-description-title" data-certification-surface>
        <h2 id="switch-description-title" class="h5">Description</h2>
        <div class="form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            id="certification-switch-described"
            aria-describedby="certification-switch-described-description"
          >
          <label class="form-check-label" for="certification-switch-described">
            Background sync
          </label>
          <div class="form-text" id="certification-switch-described-description">
            Keep team data synchronized after a network reconnect.
          </div>
        </div>
      </section>

      <section aria-labelledby="switch-standalone-title" data-certification-surface>
        <h2 id="switch-standalone-title" class="h5">Accessible name only</h2>
        <div class="form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            id="certification-switch-standalone"
            aria-label="Enable audit mode"
          >
        </div>
      </section>

      <section aria-labelledby="switch-invalid-title" data-certification-surface>
        <h2 id="switch-invalid-title" class="h5">Invalid</h2>
        <div class="form-check form-switch">
          <input
            class="form-check-input is-invalid"
            type="checkbox"
            role="switch"
            id="certification-switch-invalid"
            aria-invalid="true"
          >
          <label class="form-check-label" for="certification-switch-invalid">
            Collect usage analytics
          </label>
        </div>
      </section>

      <section aria-labelledby="switch-disabled-title" data-certification-surface>
        <h2 id="switch-disabled-title" class="h5">Disabled</h2>
        <div class="form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            id="certification-switch-disabled"
            disabled
          >
          <label class="form-check-label" for="certification-switch-disabled">
            Force MFA at login
          </label>
        </div>
      </section>
    </main>
  </body>
</html>
