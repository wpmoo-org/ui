<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Progress certification fixture</title>
    <link rel="stylesheet" href="/dist/assets/css/moo-ui.css">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
      }

      main {
        display: grid;
        gap: 1.5rem;
        max-width: 28rem;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="fixture-title">
      <h1 id="fixture-title">Progress certification fixture</h1>

      <section aria-labelledby="progress-basic-title">
        <h2 id="progress-basic-title" class="h5">Basic</h2>
        <div>
          <div
            class="progress"
            role="progressbar"
            aria-label="Upload progress"
            aria-valuenow="40"
            aria-valuemin="0"
            aria-valuemax="100"
            id="certification-progress-basic"
          >
            <div class="progress-bar" style="width: 40%"></div>
          </div>
        </div>
      </section>

      <section aria-labelledby="progress-labeled-title">
        <h2 id="progress-labeled-title" class="h5">With visible label</h2>
        <div>
          <div class="d-flex justify-content-between small mb-1">
            <span>Migration progress</span>
            <span class="text-body-secondary" id="certification-progress-labeled-percent">75%</span>
          </div>
          <div
            class="progress"
            role="progressbar"
            aria-label="Migration progress"
            aria-valuenow="75"
            aria-valuemin="0"
            aria-valuemax="100"
            id="certification-progress-labeled"
          >
            <div class="progress-bar" style="width: 75%"></div>
          </div>
        </div>
      </section>

      <section aria-labelledby="progress-bounds-title">
        <h2 id="progress-bounds-title" class="h5">Bounds</h2>
        <div class="d-grid gap-2" data-certification-progress-bounds>
          <div
            class="d-grid gap-1"
            id="certification-progress-empty-bound"
            data-certification-progress-bound
          >
            <span
              class="small text-body-secondary"
              id="certification-progress-empty-label"
            >0% empty</span>
            <div
              class="progress"
              role="progressbar"
              aria-label="Empty backup"
              aria-valuenow="0"
              aria-valuemin="0"
              aria-valuemax="100"
              id="certification-progress-empty"
            >
              <div class="progress-bar" style="width: 0%"></div>
            </div>
          </div>
          <div
            class="d-grid gap-1"
            id="certification-progress-complete-bound"
            data-certification-progress-bound
          >
            <span
              class="small text-body-secondary"
              id="certification-progress-complete-label"
            >100% complete</span>
            <div
              class="progress"
              role="progressbar"
              aria-label="Complete backup"
              aria-valuenow="100"
              aria-valuemin="0"
              aria-valuemax="100"
              id="certification-progress-complete"
            >
              <div class="progress-bar" style="width: 100%"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
