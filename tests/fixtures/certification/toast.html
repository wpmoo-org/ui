<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toast certification fixture</title>
    <link rel="stylesheet" href="/dist/assets/css/moo-ui.css">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="fixture-title">
      <h1 id="fixture-title">Toast certification fixture</h1>
      <button
        class="btn btn-primary"
        id="certification-toast-trigger"
        type="button"
        data-toast-target="#certification-toast-template"
      >
        Show notification
      </button>
    </main>

    <div
      class="toast-container toast-container--stacked position-fixed bottom-0 end-0 p-3"
      id="certification-toast-container"
      data-toast-stack="deck"
    >
      <template id="certification-toast-template" data-toast-template="toast">
        <div
          class="toast"
          id="certification-toast-template"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          data-bs-autohide="false"
        >
          <div class="toast-header">
            <strong class="me-auto">Deployment complete</strong>
            <small>just now</small>
            <button
              class="btn-close"
              type="button"
              data-bs-dismiss="toast"
              aria-label="Close notification"
            ></button>
          </div>
          <div class="toast-body">
            The production bundle is ready for review.
            <button
              class="btn btn-link btn-sm p-0 ms-2"
              type="button"
              data-bs-dismiss="toast"
              aria-label="Undo"
            >
              Undo
            </button>
          </div>
        </div>
      </template>
    </div>

    <script src="/vendor/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
      import { initBootstrapPreview } from "/assets/js/catalog/bootstrap-preview.js";

      initBootstrapPreview(document);
      document.body.dataset.toastReady = "true";
    </script>
  </body>
</html>
