<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toast stack fallback certification fixture</title>
    <link rel="stylesheet" href="/dist/assets/css/moo-ui.css">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="fixture-title">
      <h1 id="fixture-title">Toast stack fallback fixture</h1>
      <p>Static Toast markup remains in readable vertical flow without catalog JavaScript.</p>
    </main>

    <div
      class="toast-container toast-container--stacked position-fixed bottom-0 end-0 p-3"
      id="certification-toast-stack-fallback"
      data-toast-stack="deck"
    >
      <div class="toast show" role="status" aria-live="polite" aria-atomic="true">
        <div class="toast-header">
          <strong class="me-auto">First event</strong>
          <button class="btn-close" type="button" aria-label="Close first event"></button>
        </div>
        <div class="toast-body">The first static event remains readable.</div>
      </div>
      <div class="toast show" role="status" aria-live="polite" aria-atomic="true">
        <div class="toast-header">
          <strong class="me-auto">Second event</strong>
          <button class="btn-close" type="button" aria-label="Close second event"></button>
        </div>
        <div class="toast-body">The second static event remains readable.</div>
      </div>
    </div>

    <script src="/vendor/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
