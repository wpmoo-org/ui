<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkbox certification fixture</title>
    <link rel="stylesheet" href="/dist/assets/css/moo-ui.css">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
      }

      main {
        display: grid;
        gap: 1.5rem;
        max-width: 42rem;
      }

      [data-certification-surface] {
        display: grid;
        gap: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="fixture-title">
      <h1 id="fixture-title">Checkbox certification fixture</h1>

      <section aria-labelledby="checkbox-default-title" data-certification-surface>
        <h2 id="checkbox-default-title" class="h5">Default</h2>
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="certification-checkbox-default"
          >
          <label class="form-check-label" for="certification-checkbox-default">
            Receive release notes
          </label>
        </div>
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="certification-checkbox-checked"
            checked
          >
          <label class="form-check-label" for="certification-checkbox-checked">
            Include resolved incidents
          </label>
        </div>
      </section>

      <section aria-labelledby="checkbox-description-title" data-certification-surface>
        <h2 id="checkbox-description-title" class="h5">Description</h2>
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="certification-checkbox-described"
            aria-describedby="certification-checkbox-described-description"
          >
          <label class="form-check-label" for="certification-checkbox-described">
            Notify workspace owners
          </label>
          <div
            class="form-text"
            id="certification-checkbox-described-description"
          >
            Owners receive one summary after the deployment window closes.
          </div>
        </div>
      </section>

      <section aria-labelledby="checkbox-standalone-title" data-certification-surface>
        <h2 id="checkbox-standalone-title" class="h5">Accessible name only</h2>
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="certification-checkbox-standalone"
            aria-label="Accept audit export"
          >
        </div>
      </section>

      <section aria-labelledby="checkbox-invalid-title" data-certification-surface>
        <h2 id="checkbox-invalid-title" class="h5">Invalid</h2>
        <div class="form-check">
          <input
            class="form-check-input is-invalid"
            type="checkbox"
            id="certification-checkbox-invalid"
            aria-invalid="true"
            aria-describedby="certification-checkbox-invalid-feedback"
          >
          <label class="form-check-label" for="certification-checkbox-invalid">
            I confirm the export can be shared
          </label>
          <div
            class="invalid-feedback"
            id="certification-checkbox-invalid-feedback"
          >
            Confirm the export before continuing.
          </div>
        </div>
      </section>

      <section aria-labelledby="checkbox-disabled-title" data-certification-surface>
        <h2 id="checkbox-disabled-title" class="h5">Disabled</h2>
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="certification-checkbox-disabled"
            disabled
          >
          <label class="form-check-label" for="certification-checkbox-disabled">
            Locked by retention policy
          </label>
        </div>
      </section>
    </main>
  </body>
</html>
