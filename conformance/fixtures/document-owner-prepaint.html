<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moo UI conformance fixture: document owner prepaint</title>
    <link rel="stylesheet" href="assets/bootstrap.min.css">
    <link rel="stylesheet" href="assets/moo.css">
  </head>
  <body>
    <div
      class="moo-ui p-4"
      data-bs-theme="dark"
      data-moo-document-owner="true"
    >
      <script src="assets/theme-prepaint.js"></script>
      <main>
        <h1>Document owner</h1>
        <p>
          The first body application element owns the document theme and
          direction while the host streams the page.
        </p>
        <button class="btn btn-primary" type="button">Continue</button>
      </main>
    </div>
  </body>
</html>
